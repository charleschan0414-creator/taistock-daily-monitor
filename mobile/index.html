<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b5cff"><link rel="manifest" href="/manifest.json"><link rel="icon" href="/icon.svg"><title>TaiStock Monitor</title><style>
:root{color-scheme:dark;--bg:#08111f;--panel:#101d30;--muted:#91a4c1;--line:#243752;--blue:#4da3ff;--green:#38e8a1;--red:#ff6b7a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#edf4ff;font:15px system-ui,-apple-system,"Noto Sans TC",sans-serif}.wrap{max-width:760px;margin:auto;padding:20px 14px 80px}header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}h1{font-size:23px;margin:4px 0}.eyebrow{color:var(--blue);font-size:11px;font-weight:800;letter-spacing:.16em}button,.download{border:0;border-radius:10px;background:#0b5cff;color:#fff;padding:11px 14px;font-weight:700;text-decoration:none;display:inline-block}.meta,.notice{color:var(--muted);font-size:13px}.notice{border:1px solid #725a1e;background:#28200d;color:#ffd978;padding:10px;border-radius:10px;margin:14px 0}.tabs{display:flex;background:#0d192a;border-radius:12px;padding:4px;margin:16px 0}.tabs button{flex:1;background:transparent}.tabs button.active{background:#1b3558}.stock{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:15px;margin:10px 0}.top,.grid{display:flex;justify-content:space-between;gap:10px}.name{font-weight:800;font-size:17px}.code,.small{color:var(--muted);font-size:12px}.price{font-size:22px;font-weight:800;text-align:right}.up{color:var(--red)}.down{color:var(--green)}.grid{margin-top:13px;border-top:1px solid var(--line);padding-top:12px}.grid div{flex:1}.grid b{display:block;margin-top:4px}.status{margin-top:10px;color:var(--muted);font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.offline{position:sticky;top:0;z-index:5;text-align:center;background:#9a3412;padding:8px;display:none}footer{margin-top:22px;color:var(--muted);font-size:12px;line-height:1.7}.empty{text-align:center;color:var(--muted);padding:40px}</style></head><body><div id="offline" class="offline">目前離線：顯示本機上次資料，並非即時報價</div><main class="wrap"><header><div><div class="eyebrow">TAISTOCK / MOBILE MONITOR</div><h1>台股多空觀察</h1><div id="meta" class="meta">讀取中…</div><div id="gate" class="meta">策略閘門讀取中…</div></div><button id="refresh">更新現價</button></header><div class="notice">僅供研究、非投資建議。報價狀態為「非即時」時，不可視為目前成交價。</div><nav class="tabs"><button data-side="long" class="active">偏多前 10</button><button data-side="short">偏空前 10</button></nav><section id="list"></section><div class="actions"><a class="download" href="/download/latest.csv">下載 latest.csv</a><a class="download" href="/download/backtest_100d.csv">下載 100 日回測</a></div><footer id="footer">手機使用區網網址時需同一 Wi‑Fi；Cloudflare 公開網址可使用 4G／5G。電腦關機或伺服器關閉後無法連線。Android：瀏覽器選單 → 加入主畫面。iPhone Safari：分享 → 加入主畫面。</footer></main><script>
let data=null,side='long';const list=document.querySelector('#list'),meta=document.querySelector('#meta'),gate=document.querySelector('#gate'),offline=document.querySelector('#offline');
const fmt=x=>x==null?'—':Number(x).toLocaleString('zh-TW',{maximumFractionDigits:2});
function render(){const rows=data?.[side+'_top10']||[];list.innerHTML=rows.length?rows.map((r,i)=>{const q=r.realtime||{},pct=q.change_pct,cls=pct>0?'up':pct<0?'down':'';return `<article class="stock"><div class="top"><div><div class="name">${i+1}. ${r.name||''} <span class="code">${r.code||''}</span></div><div class="small">${r.market||''} · ${side==='long'?'偏多':'偏空'}</div></div><div><div class="price ${cls}">${fmt(q.price)}</div><div class="${cls}">${pct==null?'—':(pct>0?'+':'')+fmt(pct)+'%'}</div></div></div><div class="grid"><div><span class="small">觸發</span><b>${fmt(r.entry_trigger)}</b></div><div><span class="small">停損/回補</span><b>${fmt(r.stop_loss)}</b></div><div><span class="small">目標</span><b>${fmt(r.target1)} / ${fmt(r.target2)}</b></div></div><div class="status">${q.status||'無報價'} · ${q.quote_time||'—'}</div></article>`}).join(''):'<div class="empty">本方向目前沒有訊號</div>'}
async function load(){meta.textContent='更新中…';try{const r=await fetch('/api/dashboard',{cache:'no-store'});if(!r.ok)throw Error((await r.json()).error||r.status);data=await r.json();localStorage.setItem('dashboard',JSON.stringify(data));offline.style.display='none';meta.textContent=`資料 ${data.data_date||'—'} · 報價更新 ${data.generated_at||'—'}`;gate.textContent=`策略閘門：${data.strategy_gate?.status||'未啟用｜保留基準訊號'}`;render()}catch(e){const saved=localStorage.getItem('dashboard');if(saved){data=JSON.parse(saved);render()}offline.style.display='block';meta.textContent='更新失敗：'+e.message}}
document.querySelectorAll('[data-side]').forEach(b=>b.onclick=()=>{side=b.dataset.side;document.querySelectorAll('[data-side]').forEach(x=>x.classList.toggle('active',x===b));render()});document.querySelector('#refresh').onclick=load;window.addEventListener('online',load);window.addEventListener('offline',()=>offline.style.display='block');if('serviceWorker'in navigator)navigator.serviceWorker.register('/service-worker.js').catch(console.error);load();setInterval(load,60000);
</script></body></html>
